group 'com.legyver'

apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'net.nemerosa.versioning'

// Published via the Central Publisher Portal (central.sonatype.com), which replaced
// the legacy OSSRH/oss.sonatype.org Nexus instance (sunset 2025-06-30). The staging
// repository itself (URL + close/release lifecycle) is configured once at the root
// project via the io.github.gradle-nexus.publish-plugin; this script only wires up
// the publication content and signing.
// Credentials come from a Central Portal User Token, set in ${user.home}/gradle.properties:
//   sonatypeUsername=<token username>
//   sonatypePassword=<token password>
def sonatypeUsername = project.findProperty('sonatypeUsername')
def sonatypePassword = project.findProperty('sonatypePassword')

if (sonatypeUsername != null && sonatypeUsername.length() > 0) {
  apply plugin: 'signing'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'


repositories {
    mavenCentral()
}

java {
    withJavadocJar()
    withSourcesJar()
}

jar {
    manifest {
        attributes(
                'Built-By'       : sonatypeUsername,
                'Build-Timestamp': new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
                'Build-Revision' : versioning.info.commit,
                'Created-By'     : "Gradle ${gradle.gradleVersion}",
                'Build-Jdk'      : "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                'Build-OS'       : "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}"
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            def descript = ''
            afterEvaluate { Project project ->
                println "parent $project.parentLibraryPrefix"

                if (project.hasProperty('description')) {
                    descript = project.description
                }
                println "$group $artifactId:$version: $descript"
            }

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'Legyver-' + artifactId
                println "name: $name"
                url = 'https://github.com/Legyver/' + project.parentLibraryPrefix + '/tree/master/' + artifactId
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = developerId
                        name = developerName
                        email = developerEmail
                    }
                }
                scm {
                    connection = 'scm:git:github.com/Legyver/' + project.parentLibraryPrefix + '.git'
                    developerConnection = 'scm:git:ssh://github.com/Legyver/'  + project.parentLibraryPrefix + '.git'
                    url = 'https://github.com/Legyver/'  + project.parentLibraryPrefix + '/tree/master/' + artifactId
                }
                issueManagement {
                    system = 'HackerOne'
                    url = 'https://hackerone.com/central-security-project/reports/new'
                }
                withXml {
                    //using pom.description description is resolved prematurely
                    //as a workaround manually set it in the pom.xml
                    asNode().appendNode('description', descript)
                }
            }
        }
    }
    if (sonatypeUsername == null || sonatypeUsername.length() == 0) {
      println 'skipping signing'
    }
    // No repositories{} block here: the "sonatype" staging/release repository is
    // registered for this project automatically by the root project's
    // io.github.gradle-nexus.publish-plugin (see nexusPublishing {} in the root build.gradle).
}

task printProperties {
    doFirst {
        println "username: $sonatypeUsername"
        println "password: [redacted, length=${sonatypePassword == null ? 0 : sonatypePassword.length()}]"
    }
}

if (sonatypeUsername != null && sonatypeUsername.length() > 0) {
  signing {
        println 'signing'
        useGpgCmd()
        sign publishing.publications.mavenJava
  }
}

javadoc {
    failOnError = false
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

task install(dependsOn: "publishToMavenLocal")
